<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlimeHearth v0.526</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <!-- Title Screen Overlay (Simple) -->
    <!-- Loading Screen -->
    <div id="loading-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div style="font-size:32px;font-weight:bold;color:#fff;margin-bottom:20px;text-shadow:2px 2px 4px rgba(0,0,0,0.3);">SlimeHearth</div>
        <div style="font-size:18px;color:rgba(255,255,255,0.9);margin-bottom:30px;">Loading...</div>
        <div style="width:200px;height:10px;background:rgba(255,255,255,0.3);border-radius:5px;overflow:hidden;">
            <div id="loading-bar" style="width:0%;height:100%;background:#fff;transition:width 0.3s;"></div>
        </div>
    </div>
    
    <!-- Title Screen -->
    <div id="title-overlay" 
         style="position:fixed;top:0;left:0;width:100%;height:100%;background-image:url('./slimehearth-assets/images/titlescreen-background.png');background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#84fab0;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;"
         onclick="document.getElementById('title-overlay').style.display='none';document.getElementById('hatch-overlay').style.display='flex';"
         ontouchend="document.getElementById('title-overlay').style.display='none';document.getElementById('hatch-overlay').style.display='flex';event.preventDefault();">
        <p class="pulse-text" style="font-size:24px;color:rgba(255,255,255,0.9);margin-top:280px;text-shadow:2px 2px 4px rgba(0,0,0,0.3);pointer-events:none;">Tap anywhere to start</p>
        <div style="position:absolute;bottom:20px;color:rgba(255,255,255,0.7);font-size:14px;pointer-events:none;">v0.526</div>
    </div>
    <script src="game.js"></script>

</body>
</html>
